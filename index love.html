<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Heart Particle Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="a"></canvas>

<script>
const canvas = document.getElementById('a');
const c = canvas.getContext('2d');

let WIDTH = canvas.width = window.innerWidth;
let HEIGHT = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    WIDTH = canvas.width = window.innerWidth;
    HEIGHT = canvas.height = window.innerHeight;
});

// Impostazioni degli effetti visivi
const maxParticelle = 550; // Maggiore densità per un effetto più ricco
let particelle = [];
let tempo = 0;

// Configurazione della singola particella
class Particella {
    constructor() {
        this.reset();
        // Le particelle partono da punti casuali dello schermo
        this.x = Math.random() * WIDTH;
        this.y = Math.random() * HEIGHT;
    }

    reset() {
        // Angolo casuale sul percorso matematico del cuore
        this.angolo = Math.random() * Math.PI * 2;
        this.size = Math.random() * 2.5 + 0.5;
        this.speed = 0.04 + Math.random() * 0.04;
        
        // Colori sfumati dal magenta intenso al rosso vivo (HSL)
        this.hue = 330 + Math.random() * 30; 
        this.color = `hsla(${this.hue}, 100%, 65%, ${0.7 + Math.random() * 0.3})`;
    }

    update() {
        // Funzione parametrica originale per definire la forma tridimensionale del cuore
        const xCuore = 16 * Math.pow(Math.sin(this.angolo), 3);
        const yCuore = 13 * Math.cos(this.angolo) - 5 * Math.cos(2 * this.angolo) - 2 * Math.cos(3 * this.angolo) - Math.cos(4 * this.angolo);

        // EFFETTO BATTITO: Il fattore di scala oscilla nel tempo simulanzo la sistole e la diastole
        const oscillazioneBattito = 1 + Math.pow(Math.sin(tempo * 0.06), 2) * 0.12;
        const scalaBase = Math.min(WIDTH, HEIGHT) / 45; // Adatta la dimensione dello schermo
        const scalaFinale = scalaBase * oscillazioneBattito;

        // Destinazione della particella sulla mappa del cuore
        const targetX = WIDTH / 2 + xCuore * scalaFinale;
        const targetY = HEIGHT / 2 - yCuore * scalaFinale;

        // Inseguimento fluido del target (Interpolazione lineare)
        this.x += (targetX - this.x) * this.speed;
        this.y += (targetY - this.y) * this.speed;

        // Se la particella è arrivata, le viene assegnata una micro-fluttuazione per dare dinamismo
        if (Math.abs(this.x - targetX) < 5 && Math.abs(this.y - targetY) < 5) {
            this.angolo += 0.01; // Fa scivolare lentamente le particelle lungo il bordo
        }
    }

    draw() {
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
    }
}

// Generazione iniziale del blocco particelle
for (let i = 0; i < maxParticelle; i++) {
    particelle.push(new Particella());
}

// Loop grafico principale
function animazione() {
    // Sfondo semitrasparente per generare la scia luminosa delle particelle
    c.fillStyle = "rgba(0, 0, 0, 0.08)";
    c.fillRect(0, 0, WIDTH, HEIGHT);

    tempo++;

    // ATTIVAZIONE EFFETTO GLOW NEON (Mantiene le luci brillanti)
    c.shadowBlur = 12;
    
    particelle.forEach(p => {
        p.update();
        c.shadowColor = `hsl(${p.hue}, 100%, 60%)`; // Il riflesso segue il colore della particella
        p.draw();
    });

    // Disattiva il filtro ombra sul resto delle operazioni per ottimizzare la scheda grafica
    c.shadowBlur = 0;

    requestAnimationFrame(animazione);
}

// Avvio
animazione();
</script>
</body>
</html>
